<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BWS Needs Review Prototype</title>
  <style>
    :root {
      --bg: #202833;
      --panel: #27313e;
      --panel-soft: #2d3846;
      --line: #3b4857;
      --text: #e8e7e4;
      --muted: #9da6b3;
      --accent: #77c4df;
      --accent-soft: rgba(119, 196, 223, 0.14);
      --coral: #e6845a;
      --success: #70c9a0;
      --radius: 8px;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: var(--sans);
    }
    button { font: inherit; color: inherit; }
    button:focus-visible, summary:focus-visible { outline: 3px solid rgba(119,196,223,.38); outline-offset: 3px; }

    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(32,40,51,.96);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brandline { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: var(--coral);
      color: #202833;
      font-weight: 800;
    }
    .crumbs { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .crumbs strong { font-size: 15px; }
    .crumbs span { color: var(--muted); font-size: 13px; }
    .exit {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 6px;
      padding: 9px 13px;
      cursor: pointer;
    }
    .exit:hover { background: var(--panel); }

    main {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 52px 0 80px;
    }
    .pagehead { margin-bottom: 36px; }
    .pagehead h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.035em; }
    .pagehead p { margin: 0; color: var(--muted); font-size: 15px; }

    .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    .progress-label { color: var(--muted); font-size: 13px; }
    .all-link {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-weight: 650;
    }
    .segments { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 24px; }
    .segments i { height: 3px; border-radius: 99px; background: var(--line); transition: background .2s ease; }
    .segments i.done { background: var(--success); }
    .segments i.current { background: var(--accent); }

    .stage { position: relative; min-height: 560px; }
    .decision {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: clamp(24px, 5vw, 48px);
      box-shadow: 0 18px 60px rgba(8,13,20,.18);
      animation: enter .24s ease both;
    }
    @keyframes enter { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    .kind { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .decision h2 { margin: 0; max-width: 780px; font-size: clamp(26px, 4vw, 38px); line-height: 1.12; letter-spacing: -.03em; }
    .context { margin: 18px 0 32px; max-width: 760px; color: #bdc4cc; font-size: 16px; line-height: 1.6; }

    .choices { display: grid; gap: 10px; }
    .choice {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 18px 20px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #24303c;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .choice:hover { border-color: #607183; background: #293642; transform: translateY(-1px); }
    .choice.selected { border-color: var(--accent); background: var(--accent-soft); }
    .choice strong { display: block; margin-bottom: 5px; font-size: 15px; }
    .choice span { display: block; max-width: 680px; color: var(--muted); line-height: 1.45; font-size: 13px; }
    .arrow { color: var(--accent); font-size: 20px; }

    details {
      margin-top: 24px;
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }
    summary { list-style: none; color: var(--accent); cursor: pointer; font-weight: 650; }
    summary::-webkit-details-marker { display: none; }
    .evidence { margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .evidence article { padding: 16px; background: #222d38; border: 1px solid #344352; border-radius: 6px; }
    .evidence strong { display: block; margin-bottom: 8px; font-size: 13px; }
    .evidence p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    .underbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 16px; }
    .back {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 0;
      cursor: pointer;
    }
    .back:disabled { opacity: .3; cursor: default; }
    .quiet { color: #798492; font-size: 12px; }

    .drawer-scrim {
      position: fixed;
      inset: 0;
      background: rgba(10,15,22,.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 20;
    }
    .drawer-scrim.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: absolute;
      right: 0;
      top: 0;
      width: min(420px, 92vw);
      height: 100%;
      padding: 28px;
      background: #252f3b;
      border-left: 1px solid var(--line);
      transform: translateX(100%);
      transition: transform .22s ease;
      overflow: auto;
    }
    .drawer-scrim.open .drawer { transform: translateX(0); }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
    .drawer-head h3 { margin: 0; font-size: 21px; }
    .close { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; }
    .queue { display: grid; gap: 10px; }
    .queue button {
      text-align: left;
      border: 1px solid var(--line);
      background: #222c37;
      border-radius: 6px;
      padding: 15px;
      cursor: pointer;
    }
    .queue button.active { border-color: var(--accent); }
    .queue small { display: block; color: var(--muted); margin-bottom: 6px; }
    .queue strong { display: block; line-height: 1.35; }
    .queue .answer { color: var(--success); margin-top: 7px; font-size: 12px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 12px);
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 12px 15px;
      background: #121a22;
      border: 1px solid #405063;
      border-radius: 7px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 30;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast button { border: 0; background: transparent; color: var(--accent); cursor: pointer; font-weight: 700; }

    .complete { text-align: center; padding: 72px 36px; }
    .check { width: 46px; height: 46px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 50%; color: #173329; background: var(--success); font-weight: 900; }
    .complete h2 { margin: 0 0 10px; font-size: 34px; }
    .complete > p { margin: 0 auto 28px; max-width: 560px; color: var(--muted); }
    .summary { max-width: 690px; margin: 0 auto 28px; text-align: left; display: grid; gap: 8px; }
    .summary div { padding: 14px 16px; border: 1px solid var(--line); border-radius: 6px; background: #222c37; }
    .summary small { display: block; color: var(--muted); margin-bottom: 4px; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    .primary, .secondary { border-radius: 6px; padding: 11px 16px; cursor: pointer; font-weight: 750; }
    .primary { border: 1px solid var(--accent); background: var(--accent); color: #17232c; }
    .secondary { border: 1px solid var(--line); background: transparent; }

    @media (max-width: 700px) {
      .topbar { padding: 0 16px; }
      .crumbs span { display: none; }
      main { width: min(100% - 24px, 980px); padding-top: 28px; }
      .decision { padding: 24px 18px; }
      .evidence { grid-template-columns: 1fr; }
      .underbar { align-items: flex-start; }
      .quiet { text-align: right; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brandline">
      <div class="mark">M</div>
      <div class="crumbs"><strong>MycoPop</strong><span>/ Brand Brain / Needs review</span></div>
    </div>
    <button class="exit" type="button">Exit review</button>
  </header>

  <main>
    <div class="pagehead">
      <h1>Needs review</h1>
      <p>Make the few decisions where your judgment changes the brand.</p>
    </div>

    <div id="progress"></div>
    <div class="stage" id="stage"></div>
  </main>

  <div class="drawer-scrim" id="drawerScrim" aria-hidden="true">
    <aside class="drawer" aria-label="All review decisions">
      <div class="drawer-head"><h3>Review decisions</h3><button class="close" id="closeDrawer" aria-label="Close">×</button></div>
      <div class="queue" id="queue"></div>
    </aside>
  </div>

  <div class="toast" id="toast"><span>Decision saved</span><button id="undo" type="button">Undo</button></div>

  <script>
    const decisions = [
      {
        kind: "Creative direction",
        question: "Which retro direction should lead MycoPop's future work?",
        context: "Existing guidance points toward early digital culture. Newer references point toward the lived late 1980s and 1990s.",
        evidence: [
          ["Existing guidance", "Early games, home computers, pixel graphics, interfaces, CRT screens, scan lines, and limited-color display language."],
          ["Newer references", "People, clothes, cars, work, nightlife, tube TVs, strip malls, parking lots, and candid photography from the late 1980s and 1990s."]
        ],
        choices: [
          ["Keep early digital as the lead", "Games, computers, graphics, and interfaces stay at the center of the retro language."],
          ["Lead with the lived late 80s and 90s", "People, places, clothing, work, nightlife, cars, and period details become the primary world."],
          ["Split the roles by medium", "Photography uses the lived period. Graphics, interfaces, and motion use the early digital language."],
          ["Leave this open", "Keep both directions available without naming a lead direction yet."]
        ]
      },
      {
        kind: "Audience direction",
        question: "Should skilled night workers and subcultural doers lead future casting?",
        context: "Several references repeatedly show people whose work or interests happen after hours. The current customer material describes a broader everyday audience.",
        evidence: [
          ["Creative references", "Line cooks, bike messengers, DJs, night-shift nurses, bartenders, shop openers, and other practical night workers appear repeatedly."],
          ["Customer material", "The current audience evidence supports ingredient-conscious adults seeking caffeine-free focus and functional mushrooms without a narrow occupation or scene."]
        ],
        choices: [
          ["Make them the casting lead", "Future people and situations center this group unless a brief asks for something else."],
          ["Use them as recurring characters", "Keep the broader audience, while this group becomes a distinctive recurring part of the world."],
          ["Keep the audience broad", "Treat the night-worker references as inspiration, not as the main casting direction."],
          ["Leave this open", "Do not set a casting priority yet."]
        ]
      },
      {
        kind: "Audience validation",
        question: "How closely should the evolved cast relate to MycoPop's current customers?",
        context: "The evolved world has room to stretch beyond today's buyer profile. This ruling sets how far casting should move before new customer evidence exists.",
        evidence: [
          ["Current evidence", "Customer material supports a broad group seeking caffeine-free energy, focus, and functional mushrooms."],
          ["Evolved direction", "The newer world introduces more specific occupations, social scenes, and cultural signals than the present-day customer evidence proves."]
        ],
        choices: [
          ["Stay close to current customers", "New casting should remain recognizable as a direct extension of today's audience."],
          ["Allow a measured stretch", "Use adjacent people and scenes when they fit the brand, without treating them as proven customer truth."],
          ["Let the evolved world lead", "Casting follows the aspirational world even where current audience evidence is thin."],
          ["Leave this open", "Keep the distinction unresolved for now."]
        ]
      }
    ];

    let index = 0;
    let answers = Array(decisions.length).fill(null);
    let previous = null;
    let toastTimer = null;

    const progress = document.getElementById('progress');
    const stage = document.getElementById('stage');
    const drawerScrim = document.getElementById('drawerScrim');
    const queue = document.getElementById('queue');
    const toast = document.getElementById('toast');

    function renderProgress() {
      if (answers.every(Boolean)) { progress.innerHTML = ''; return; }
      progress.innerHTML = `
        <div class="progress-row">
          <span class="progress-label">Decision ${index + 1} of ${decisions.length}</span>
          <button class="all-link" id="openDrawer" type="button">View all decisions</button>
        </div>
        <div class="segments" aria-hidden="true">
          ${decisions.map((_, i) => `<i class="${answers[i] ? 'done' : i === index ? 'current' : ''}"></i>`).join('')}
        </div>`;
      document.getElementById('openDrawer').onclick = openDrawer;
    }

    function renderDecision() {
      renderProgress();
      if (answers.every(Boolean)) { renderComplete(); return; }
      const d = decisions[index];
      stage.innerHTML = `
        <section class="decision">
          <div class="kind">${d.kind}</div>
          <h2>${d.question}</h2>
          <p class="context">${d.context}</p>
          <div class="choices">
            ${d.choices.map((c, i) => `
              <button class="choice ${answers[index] === i ? 'selected' : ''}" data-choice="${i}" type="button">
                <span><strong>${c[0]}</strong><span>${c[1]}</span></span><b class="arrow">›</b>
              </button>`).join('')}
          </div>
          <details>
            <summary>Why am I seeing this?</summary>
            <div class="evidence">
              ${d.evidence.map(e => `<article><strong>${e[0]}</strong><p>${e[1]}</p></article>`).join('')}
            </div>
          </details>
        </section>
        <div class="underbar">
          <button class="back" id="back" type="button" ${index === 0 ? 'disabled' : ''}>← Back</button>
          <span class="quiet">Source detail stays available only when needed.</span>
        </div>`;
      stage.querySelectorAll('[data-choice]').forEach(btn => btn.onclick = () => choose(Number(btn.dataset.choice)));
      document.getElementById('back').onclick = () => { if (index > 0) { index -= 1; renderDecision(); } };
    }

    function choose(choiceIndex) {
      previous = { index, answer: answers[index] };
      answers[index] = choiceIndex;
      showToast();
      setTimeout(() => {
        const next = answers.findIndex((answer, i) => i > index && answer === null);
        if (next >= 0) index = next;
        else {
          const firstOpen = answers.findIndex(answer => answer === null);
          if (firstOpen >= 0) index = firstOpen;
        }
        renderDecision();
      }, 260);
    }

    function showToast() {
      clearTimeout(toastTimer);
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 4200);
    }

    function openDrawer() {
      renderQueue();
      drawerScrim.classList.add('open');
      drawerScrim.setAttribute('aria-hidden', 'false');
    }
    function closeDrawer() {
      drawerScrim.classList.remove('open');
      drawerScrim.setAttribute('aria-hidden', 'true');
    }
    function renderQueue() {
      queue.innerHTML = decisions.map((d, i) => `
        <button class="${i === index ? 'active' : ''}" data-index="${i}" type="button">
          <small>${answers[i] === null ? 'Needs decision' : 'Resolved'}</small>
          <strong>${d.question}</strong>
          ${answers[i] === null ? '' : `<div class="answer">${d.choices[answers[i]][0]}</div>`}
        </button>`).join('');
      queue.querySelectorAll('[data-index]').forEach(btn => btn.onclick = () => {
        index = Number(btn.dataset.index);
        closeDrawer();
        if (answers.every(Boolean)) answers[index] = null;
        renderDecision();
      });
    }

    function renderComplete() {
      stage.innerHTML = `
        <section class="decision complete">
          <div class="check">✓</div>
          <h2>Review complete</h2>
          <p>Three decisions are saved. The Brand Brain draft is ready for a read as one coherent system.</p>
          <div class="summary">
            ${decisions.map((d, i) => `<div><small>${d.kind}</small><strong>${d.choices[answers[i]][0]}</strong></div>`).join('')}
          </div>
          <div class="actions">
            <button class="primary" type="button">Review Brand Brain</button>
            <button class="secondary" type="button">Go to Design Studio</button>
            <button class="secondary" id="change" type="button">Change a decision</button>
          </div>
        </section>`;
      document.getElementById('change').onclick = () => { index = 0; openDrawer(); };
    }

    document.getElementById('closeDrawer').onclick = closeDrawer;
    drawerScrim.onclick = (event) => { if (event.target === drawerScrim) closeDrawer(); };
    document.getElementById('undo').onclick = () => {
      if (!previous) return;
      answers[previous.index] = previous.answer;
      index = previous.index;
      previous = null;
      toast.classList.remove('show');
      renderDecision();
    };

    renderDecision();
  </script>
</body>
</html>
